name: Link check

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - data/tools.json
      - scripts/check_links.py
      - .github/workflows/link-check.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog links
        id: check
        run: |
          set +e
          python scripts/check_links.py > link-report.md 2>&1
          code=$?
          cat link-report.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Open or update tracking issue
        if: steps.check.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const title = 'Broken catalog links';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${fs.readFileSync('link-report.md', 'utf8')}\n\nWorkflow run: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
      - name: Fail when links are broken
        if: steps.check.outputs.code != '0'
        run: exit 1
